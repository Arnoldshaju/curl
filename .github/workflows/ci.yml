name: LinkForge CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ----------------------------------------------------------------------------
  # Backend Quality Gate: Lint, Migrations, Test Suite & OpenAPI Schema
  # ----------------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          USE_SQLITE: "True"
          SECRET_KEY: "ci-secret-key-for-automated-github-actions"
        run: |
          python manage.py migrate

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        env:
          USE_SQLITE: "True"
          SECRET_KEY: "ci-secret-key-for-automated-github-actions"
        run: |
          python manage.py test apps.authentication.tests apps.links.tests -v 2

      - name: Validate OpenAPI 3.0 Schema Generation
        working-directory: ./backend
        env:
          USE_SQLITE: "True"
          SECRET_KEY: "ci-secret-key-for-automated-github-actions"
        run: |
          python manage.py spectacular --file schema.yml

  # ----------------------------------------------------------------------------
  # Frontend Quality Gate: Typecheck & Production Build
  # ----------------------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SHORT_DOMAIN: http://localhost:8000/r
        run: npm run build

  # ----------------------------------------------------------------------------
  # Container Quality Gate: Compose Config Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
